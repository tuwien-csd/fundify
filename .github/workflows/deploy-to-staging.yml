name: Build and push Docker image

on:
  push:
    branches:
      - develop

jobs:
  build-and-push-be:
    environment: staging
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-be
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Get version from pom.xml
        id: get_version
        run: echo "version=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' backend/pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:latest
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:${{ steps.get_version.outputs.version }}
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:${{ steps.get_version.outputs.version }}-${{github.sha}}
  build-and-push-fe:
    environment: staging
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-fe
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version from package.json
        id: get_version
        run: echo "version=$(npm pkg get version --prefix ./frontend | sed 's/"//g')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:latest
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:${{ steps.get_version.outputs.version }}
            ${{ vars.ARISNET_DOCKER_REGISTRY }}/${{env.IMAGE_NAME}}:${{ steps.get_version.outputs.version }}-${{github.sha}}
