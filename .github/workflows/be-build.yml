name: Build, Test, Verify Backend
on:
  pull_request:
    paths:
      - 'backend/**' # Only run when backend changes are detected

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: backend/mvn -B package
