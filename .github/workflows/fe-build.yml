name: Build, Lint, Test Frontend
on:
  pull_request:
    paths:
      - 'frontend/**' # Only run when backend changes are detected

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          cache-dependency-path: frontend/package-lock.json
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run ci:test

