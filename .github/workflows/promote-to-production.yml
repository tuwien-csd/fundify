name: Promote Docker Images to Production

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Staging image tag to promote (e.g., 1.2.3-<commit-sha>). If empty, will use computed version and current commit SHA."
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  promote-be:
    name: Promote Backend Image
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-be
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.pull_retag_and_push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version and source tag
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' backend/pom.xml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # If source_tag input provided, use it; otherwise use VERSION
          if [ -n "${{ inputs.source_tag }}" ]; then
            SRC_TAG="${{ inputs.source_tag }}"
          else
            SRC_TAG="${VERSION}"
          fi
          echo "source_tag=$SRC_TAG" >> "$GITHUB_OUTPUT"

      - name: Pull from staging, retag, and push to production
        id: pull_retag_and_push
        shell: bash
        env:
          REGISTRY: registry.arisnet.ac.at
          STAGING_PROJECT: aris-fundify-staging
          PROD_PROJECT: aris-fundify-prod
          STAGING_USER: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_USERNAME }}
          STAGING_PASS: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_PASSWORD }}
          PROD_USER: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_USERNAME }}
          PROD_PASS: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
          SRC_TAG: ${{ steps.meta.outputs.source_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          SRC_IMAGE="${REGISTRY}/${STAGING_PROJECT}/${IMAGE_NAME}:${SRC_TAG}"
          PROD_IMAGE_BASE="${REGISTRY}/${PROD_PROJECT}/${IMAGE_NAME}"

          echo "Logging into staging registry..."
          echo "${STAGING_PASS}" | docker login "${REGISTRY}" -u "${STAGING_USER}" --password-stdin

          echo "Pulling ${SRC_IMAGE} from staging..."
          docker pull "${SRC_IMAGE}"

          echo "Logging into production registry..."
          echo "${PROD_PASS}" | docker login "${REGISTRY}" -u "${PROD_USER}" --password-stdin

          FULL_IMAGE_TAG_WITH_SHA="${PROD_IMAGE_BASE}:${VERSION}-${{ github.sha }}"
          echo "Determined full image tag: ${FULL_IMAGE_TAG_WITH_SHA}"
          echo "image_tag=${FULL_IMAGE_TAG_WITH_SHA}" >> "$GITHUB_OUTPUT"
          
          echo "Retagging for production..."
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${VERSION}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${FULL_IMAGE_TAG_WITH_SHA}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:latest"
          
          # Get the image digest
          # extracts the "sha256:abcdef...." from the output of "docker inspect"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${FULL_IMAGE_TAG_WITH_SHA}" | cut -d'@' -f2)
          echo "Image digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Pushing to production registry..."
          docker push "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker push "${PROD_IMAGE_BASE}:${VERSION}"
          docker push "${PROD_IMAGE_BASE}:${FULL_IMAGE_TAG_WITH_SHA}"
          docker push "${PROD_IMAGE_BASE}:latest"

          echo "Logging out..."
          docker logout "${REGISTRY}"

  promote-fe:
    name: Promote Frontend Image
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-fe
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.pull_retag_and_push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version and source tag
        id: meta
        shell: bash
        run: |
          VERSION="$(npm pkg get version --prefix ./frontend | sed 's/"//g')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.source_tag }}" ]; then
            SRC_TAG="${{ inputs.source_tag }}"
          else
            SRC_TAG="${VERSION}"
          fi
          echo "source_tag=$SRC_TAG" >> "$GITHUB_OUTPUT"

      - name: Pull from staging, retag, and push to production
        shell: bash
        id: pull_retag_and_push
        env:
          REGISTRY: registry.arisnet.ac.at
          STAGING_PROJECT: aris-fundify-staging
          PROD_PROJECT: aris-fundify-prod
          STAGING_USER: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_USERNAME }}
          STAGING_PASS: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_PASSWORD }}
          PROD_USER: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_USERNAME }}
          PROD_PASS: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
          SRC_TAG: ${{ steps.meta.outputs.source_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          SRC_IMAGE="${REGISTRY}/${STAGING_PROJECT}/${IMAGE_NAME}:${SRC_TAG}"
          PROD_IMAGE_BASE="${REGISTRY}/${PROD_PROJECT}/${IMAGE_NAME}"

          echo "Logging into staging registry..."
          echo "${STAGING_PASS}" | docker login "${REGISTRY}" -u "${STAGING_USER}" --password-stdin

          echo "Pulling ${SRC_IMAGE} from staging..."
          docker pull "${SRC_IMAGE}"
          
          FULL_IMAGE_TAG_WITH_SHA="${PROD_IMAGE_BASE}:${VERSION}-${{ github.sha }}"
          echo "image_tag=${FULL_IMAGE_TAG_WITH_SHA}" >> "$GITHUB_OUTPUT"
          echo "Determined full image tag: ${FULL_IMAGE_TAG_WITH_SHA}"

          echo "Logging into production registry..."
          echo "${PROD_PASS}" | docker login "${REGISTRY}" -u "${PROD_USER}" --password-stdin

          echo "Retagging for production..."
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${VERSION}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${FULL_IMAGE_TAG_WITH_SHA}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:latest"
          
          # Get the image digest
          # extracts the "sha256:abcdef...." from the output of "docker inspect"
          # Note: Since we change the image name from staging to prod, the digest also changes.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${FULL_IMAGE_TAG_WITH_SHA}" | cut -d'@' -f2)
          echo "Image digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Pushing to production registry..."
          docker push "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker push "${PROD_IMAGE_BASE}:${VERSION}"
          docker push "${PROD_IMAGE_BASE}:${FULL_IMAGE_TAG_WITH_SHA}"
          docker push "${PROD_IMAGE_BASE}:latest"

          echo "Logging out..."
          docker logout "${REGISTRY}"

  update-helm-values:
    name: Update Helm Values in GitLab
    needs: [promote-be, promote-fe]
    environment: production
    env:
      BE_IMAGE_TAG: ${{ needs.promote-be.outputs.image_tag }}
      BE_DIGEST_TO_DEPLOY: ${{ needs.promote-be.outputs.digest }}
      FE_IMAGE_TAG: ${{ needs.promote-fe.outputs.image_tag }}
      FE_DIGEST_TO_DEPLOY: ${{ needs.promote-fe.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab GitOps repo
        # clone into the current directory
        run: git clone https://${{ secrets.GITLAB_USER_NAME }}:${{ secrets.GITLAB_USER_TOKEN }}@gitlab.tuwien.ac.at/aris-gitops-apps/aris-fundify-prod.git .

      - name: Update prod values.yaml
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="environments/prod/values.yaml"
          FULL_BE_TAG=${BE_IMAGE_TAG}@${BE_DIGEST_TO_DEPLOY}
          FULL_FE_TAG=${FE_IMAGE_TAG}@${FE_DIGEST_TO_DEPLOY}

          echo "Updating $VALUES_FILE with backend tag: $FULL_BE_TAG and frontend tag: $FULL_FE_TAG"

          # Update backend.image.tag
          yq eval ".backend.image.tag = \"$FULL_BE_TAG\"" -i $VALUES_FILE

          # Update frontend.image.tag
          yq eval ".frontend.image.tag = \"$FULL_FE_TAG\"" -i $VALUES_FILE

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "martin.schwarz@andamp.io"

          git add environments/prod/values.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update image tags with digests: BE=${BE_IMAGE_TAG}@${BE_DIGEST_TO_DEPLOY}, FE=${FE_IMAGE_TAG}@${FE_DIGEST_TO_DEPLOY}"
          git push
