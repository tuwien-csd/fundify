name: deploy-to-production

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Staging image tag to promote (e.g., 1.2.3-<commit-sha>). If empty, will use computed version and current commit SHA."
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  promote-be:
    name: Promote Backend Image
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-be
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version and source tag
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' backend/pom.xml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # If source_tag input provided, use it; otherwise use VERSION-GITHUB_SHA
          if [ -n "${{ inputs.source_tag }}" ]; then
            SRC_TAG="${{ inputs.source_tag }}"
          else
            SRC_TAG="${VERSION}-${GITHUB_SHA}"
          fi
          echo "source_tag=$SRC_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to STAGING Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.STAGING_ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Login to PRODUCTION Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.PROD_ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Pull from staging, retag, and push to production
        shell: bash
        env:
          STAGING_REGISTRY: ${{ vars.STAGING_ARISNET_DOCKER_REGISTRY }}
          PROD_REGISTRY: ${{ vars.PROD_ARISNET_DOCKER_REGISTRY }}
          VERSION: ${{ steps.meta.outputs.version }}
          SRC_TAG: ${{ steps.meta.outputs.source_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          SRC_IMAGE="${STAGING_REGISTRY}/${IMAGE_NAME}:${SRC_TAG}"
          PROD_IMAGE_BASE="${PROD_REGISTRY}/${IMAGE_NAME}"

          echo "Pulling ${SRC_IMAGE} from staging..."
          docker pull "${SRC_IMAGE}"

          echo "Retagging for production..."
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${VERSION}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:latest"

          echo "Pushing to production registry..."
          docker push "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker push "${PROD_IMAGE_BASE}:${VERSION}"
          docker push "${PROD_IMAGE_BASE}:latest"

  promote-fe:
    name: Promote Frontend Image
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fundify-fe
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version and source tag
        id: meta
        shell: bash
        run: |
          VERSION="$(npm pkg get version --prefix ./frontend | sed 's/"//g')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.source_tag }}" ]; then
            SRC_TAG="${{ inputs.source_tag }}"
          else
            SRC_TAG="${VERSION}-${GITHUB_SHA}"
          fi
          echo "source_tag=$SRC_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to STAGING Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.STAGING_ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.STAGING_ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Login to PRODUCTION Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.PROD_ARISNET_DOCKER_REGISTRY }}
          username: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.PROD_ARISNET_DOCKER_REGISTRY_PASSWORD }}

      - name: Pull from staging, retag, and push to production
        shell: bash
        env:
          STAGING_REGISTRY: ${{ vars.STAGING_ARISNET_DOCKER_REGISTRY }}
          PROD_REGISTRY: ${{ vars.PROD_ARISNET_DOCKER_REGISTRY }}
          VERSION: ${{ steps.meta.outputs.version }}
          SRC_TAG: ${{ steps.meta.outputs.source_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          SRC_IMAGE="${STAGING_REGISTRY}/${IMAGE_NAME}:${SRC_TAG}"
          PROD_IMAGE_BASE="${PROD_REGISTRY}/${IMAGE_NAME}"

          echo "Pulling ${SRC_IMAGE} from staging..."
          docker pull "${SRC_IMAGE}"

          echo "Retagging for production..."
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:${VERSION}"
          docker tag "${SRC_IMAGE}" "${PROD_IMAGE_BASE}:latest"

          echo "Pushing to production registry..."
          docker push "${PROD_IMAGE_BASE}:${SRC_TAG}"
          docker push "${PROD_IMAGE_BASE}:${VERSION}"
          docker push "${PROD_IMAGE_BASE}:latest"
